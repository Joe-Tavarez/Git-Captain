# SAM configuration file for Git-Captain Serverless
# This file stores default parameters for SAM deployments
# Created by sam deploy --guided

version = 0.1

[default]
[default.global.parameters]
stack_name = "git-captain-serverless"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "git-captain-serverless"
region = "us-east-2"
image_repositories = []
disable_rollback = false
parameter_overrides = "GitHubOrgName=\"ConfusedDeer\""

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"
